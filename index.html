<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>サイレントカメラ</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

#videoContainer {
  position: fixed;
  inset: 0;
  background: #000;
}

video {
  width: 100%; height: 100%;
  object-fit: cover;
}

video.mirror { transform: scaleX(-1); }

canvas { display: none; }

/* Flash feedback */
#flash {
  position: fixed; inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 50;
}

#flash.on { opacity: 0.6; transition: none; }
#flash.off { opacity: 0; transition: opacity 0.15s; }

/* Focus ring */
#focus {
  position: fixed;
  width: 60px; height: 60px;
  border: 1.5px solid #ffd600;
  border-radius: 2px;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -50%) scale(1.2);
  transition: opacity 0.15s, transform 0.15s;
  z-index: 40;
}

#focus.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* Bottom bar — shutter + switch only */
#bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 20px 0 calc(var(--safe-bottom) + 20px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 48px;
  z-index: 30;
}

/* Shutter */
#shutter {
  width: 68px; height: 68px;
  border-radius: 50%;
  border: 3px solid #fff;
  background: transparent;
  cursor: pointer;
  position: relative;
  -webkit-appearance: none;
}

#shutter::after {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  background: #fff;
}

#shutter:active { transform: scale(0.9); }
#shutter:active::after { background: #bbb; }

/* Switch */
#switch {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.12);
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-appearance: none;
}

#switch:active { background: rgba(255,255,255,0.25); }

/* Zoom indicator */
#zoom {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  font-size: 28px;
  font-weight: 700;
  text-shadow: 0 1px 6px rgba(0,0,0,0.7);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
  z-index: 40;
}

#zoom.show { opacity: 1; }

/* Toast */
#toast {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 16px;
  border-radius: 16px;
  background: rgba(0,0,0,0.5);
  z-index: 200;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
  white-space: nowrap;
}

#toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="videoContainer">
  <video id="video" autoplay playsinline muted></video>
</div>
<canvas id="canvas"></canvas>
<div id="flash"></div>
<div id="focus"></div>
<div id="zoom"></div>

<div id="bar">
  <button id="shutter" aria-label="撮影"></button>
  <button id="switch" aria-label="カメラ切替">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2h-3l-2-2H11L9 5H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2z"/><circle cx="12" cy="11" r="3"/></svg>
  </button>
</div>

<div id="toast"></div>

<script>
(function() {
  'use strict';

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const flash = document.getElementById('flash');
  const focusEl = document.getElementById('focus');
  const zoomEl = document.getElementById('zoom');
  const shutterBtn = document.getElementById('shutter');
  const switchBtn = document.getElementById('switch');
  const toastEl = document.getElementById('toast');

  let stream = null;
  let facing = 'environment';
  let zoomLevel = 1;
  let minZoom = 1;
  let maxZoom = 10;
  let pinchStart = 0;
  let pinchZoomStart = 1;
  let zoomHideTimer = null;
  let toastTimer = null;

  // ── Auto-start camera immediately ──
  startCamera();

  async function startCamera() {
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 3840 }, height: { ideal: 2160 } },
        audio: false
      });

      video.srcObject = stream;
      await video.play();
      video.classList.toggle('mirror', facing === 'user');

      const track = stream.getVideoTracks()[0];
      if (track.getCapabilities) {
        const caps = track.getCapabilities();
        if (caps.zoom) {
          minZoom = caps.zoom.min || 1;
          maxZoom = caps.zoom.max || 10;
        }
      }

      zoomLevel = 1;
      applyZoom();
    } catch (e) {
      // Retry once after a short delay (covers first-time permission grant)
      setTimeout(() => {
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: facing }, audio: false
        }).then(s => {
          stream = s;
          video.srcObject = s;
          video.play();
        }).catch(() => {});
      }, 500);
    }
  }

  // ── Zoom ──
  function applyZoom() {
    if (!stream) return;
    const track = stream.getVideoTracks()[0];
    if (track.getCapabilities) {
      const caps = track.getCapabilities();
      if (caps.zoom) {
        zoomLevel = Math.min(Math.max(zoomLevel, minZoom), maxZoom);
        track.applyConstraints({ advanced: [{ zoom: zoomLevel }] }).catch(() => {});
      }
    }
  }

  function showZoomIndicator() {
    zoomEl.textContent = zoomLevel.toFixed(1) + 'x';
    zoomEl.classList.add('show');
    clearTimeout(zoomHideTimer);
    zoomHideTimer = setTimeout(() => zoomEl.classList.remove('show'), 800);
  }

  // Pinch
  document.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchStart = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      pinchZoomStart = zoomLevel;
    }
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      zoomLevel = pinchZoomStart * (dist / pinchStart);
      applyZoom();
      showZoomIndicator();
    }
  }, { passive: true });

  // Wheel (desktop)
  document.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomLevel += e.deltaY > 0 ? -0.3 : 0.3;
    zoomLevel = Math.max(minZoom, zoomLevel);
    applyZoom();
    showZoomIndicator();
  }, { passive: false });

  // ── Tap to focus ──
  document.addEventListener('click', (e) => {
    if (e.target.closest('button')) return;
    focusEl.style.left = e.clientX + 'px';
    focusEl.style.top = e.clientY + 'px';
    focusEl.classList.add('show');
    setTimeout(() => focusEl.classList.remove('show'), 600);

    if (!stream) return;
    const track = stream.getVideoTracks()[0];
    if (track.getCapabilities) {
      const caps = track.getCapabilities();
      if (caps.focusMode && caps.focusMode.includes('manual')) {
        const rect = video.getBoundingClientRect();
        track.applyConstraints({
          advanced: [{ focusMode: 'manual', pointsOfInterest: [{
            x: (e.clientX - rect.left) / rect.width,
            y: (e.clientY - rect.top) / rect.height
          }]}]
        }).catch(() => {});
        setTimeout(() => {
          track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        }, 3000);
      }
    }
  });

  // ── Capture & auto-save ──
  shutterBtn.addEventListener('click', capture);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); capture(); }
  });

  async function capture() {
    if (!stream || !video.videoWidth) return;

    // Flash
    flash.classList.remove('off');
    flash.classList.add('on');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        flash.classList.remove('on');
        flash.classList.add('off');
      });
    });

    const w = video.videoWidth, h = video.videoHeight;
    canvas.width = w; canvas.height = h;
    if (facing === 'user') { ctx.translate(w, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, w, h);
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.95));

    // Auto-save: try Web Share API first (iOS → "Save Image")
    const file = new File([blob], 'photo.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        toast('保存しました');
        return;
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }

    // Fallback: trigger download
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const d = new Date();
    a.download = 'IMG_' + d.getFullYear() +
      String(d.getMonth()+1).padStart(2,'0') +
      String(d.getDate()).padStart(2,'0') + '_' +
      String(d.getHours()).padStart(2,'0') +
      String(d.getMinutes()).padStart(2,'0') +
      String(d.getSeconds()).padStart(2,'0') + '.jpg';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('保存しました');
  }

  // ── Switch camera ──
  switchBtn.addEventListener('click', () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    startCamera();
  });

  // ── Toast ──
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
  }

  // ── SW ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
